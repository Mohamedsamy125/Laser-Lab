<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Laser Lab · لوحة اختبار اللاب</title><link rel="icon" href="data:,"><style>
*{box-sizing:border-box}body{margin:0;background:#02090e;color:#e5f0ef;font-family:system-ui,sans-serif;overflow:hidden}.screen{position:fixed;inset:14px;border:clamp(20px,3vmin,32px) solid #006aff;background:#09141c;overflow:hidden}.grid{position:absolute;inset:0;background-image:linear-gradient(#a4c5d51a 1px,transparent 1px),linear-gradient(90deg,#a4c5d51a 1px,transparent 1px);background-size:10% 10%}.title{position:absolute;top:3%;width:100%;text-align:center;font-size:clamp(14px,2vmin,22px);color:#bcd0d9}.target{position:absolute;width:clamp(28px,6vmin,64px);aspect-ratio:1;transform:translate(-50%,-50%);border:2px solid #dce7e3;border-radius:50%;display:grid;place-items:center;font:14px monospace;color:#aabcc8}.target:before,.target:after{content:'';position:absolute;background:#dce7e3}.target:before{height:1px;width:150%}.target:after{width:1px;height:150%}.target span{position:absolute;top:135%;white-space:nowrap;background:#09141c;padding:2px 5px}.actions{position:absolute;bottom:3%;width:100%;display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap}.actions button,.actions a{font:14px system-ui;padding:8px 14px;min-height:42px;background:#142a36;color:#dce7e3;border:1px solid #9ab8c74d;text-decoration:none;cursor:pointer}.size{position:absolute;bottom:11%;width:100%;text-align:center;color:#879eac;font:12px monospace}.corner{position:absolute;font:18px monospace;color:#dce7e3}.tl{top:10px;left:10px}.tr{top:10px;right:10px}.bl{bottom:10px;left:10px}.br{bottom:10px;right:10px}
</style></head><body><main class="screen" aria-label="لوحة اختبار الإطار وإحداثيات الليزر"><div class="grid"></div><div class="title">افتح مود الكاميرا على الموبايل وصوّر هذه اللوحة</div><span class="corner tl">1</span><span class="corner tr">2</span><span class="corner br">3</span><span class="corner bl">4</span><div class="target" style="left:25%;top:25%"><span>25% · 25%</span></div><div class="target" style="left:50%;top:25%"><span>50% · 25%</span></div><div class="target" style="left:75%;top:25%"><span>75% · 25%</span></div><div class="target" style="left:25%;top:50%"><span>25% · 50%</span></div><div class="target" style="left:50%;top:50%"><span>50% · 50%</span></div><div class="target" style="left:75%;top:50%"><span>75% · 50%</span></div><div class="target" style="left:25%;top:75%"><span>25% · 75%</span></div><div class="target" style="left:50%;top:75%"><span>50% · 75%</span></div><div class="target" style="left:75%;top:75%"><span>75% · 75%</span></div><div id="size" class="size"></div><div class="actions"><button id="full">ملء الشاشة</button><a href="./">فتح اللعبة على اللاب</a><a href="./debug.html">مود كاميرا الموبايل</a></div></main><script type="module">const screen=document.querySelector('.screen'),size=document.getElementById('size');new ResizeObserver(()=>{size.textContent=screen.clientWidth+' × '+screen.clientHeight;}).observe(screen);document.getElementById('full').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}catch{size.textContent='ملء الشاشة غير مدعوم في هذا المتصفح';}};</script></body></html>
